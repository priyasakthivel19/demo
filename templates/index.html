<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMate</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f2f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .chat-container {
    width: 420px;
    max-width: 95vw;
    height: 640px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    background: #4f46e5;
    color: #fff;
    padding: 18px;
    text-align: center;
  }

  .chat-header h1 {
    margin: 0;
    font-size: 18px;
  }

  .chat-header p {
    margin: 4px 0 0;
    font-size: 12px;
    opacity: 0.85;
  }

  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .message.user {
    align-self: flex-end;
    background: #4f46e5;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.bot {
    align-self: flex-start;
    background: #eef0f7;
    color: #1f2937;
    border-bottom-left-radius: 4px;
  }

  .message.bot.typing {
    color: #6b7280;
    font-style: italic;
  }

  .chat-input {
    display: flex;
    border-top: 1px solid #e5e7eb;
    padding: 12px;
    gap: 8px;
  }

  .chat-input input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }

  .chat-input input:focus {
    border-color: #4f46e5;
  }

  .chat-input button {
    background: #4f46e5;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }

  .chat-input button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h1>StudyMate</h1>
    <p>Your AI study assistant — ask me anything about your studies</p>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      Hi! I'm StudyMate. Ask me any question related to your studies —
      subjects, homework, exam prep, or concepts you're stuck on.
    </div>
  </div>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const chatMessages = document.getElementById('chatMessages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'message ' + sender;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    userInput.value = '';
    sendBtn.disabled = true;

    const typingEl = addMessage('StudyMate is thinking...', 'bot typing');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typingEl.remove();
      addMessage(data.reply || 'Sorry, something went wrong.', 'bot');
    } catch (err) {
      typingEl.remove();
      addMessage('Network error. Please try again.', 'bot');
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
